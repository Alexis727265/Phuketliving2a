"$schema" = "https://open-api.netlify.com/netlify.schema.json"
[build]
command = "node build.mjs"
publish = "dist"
[build.environment]
NODE_VERSION = "24"
[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
X-Frame-Options = "DENY"
Cache-Control = "no-cache"
Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://cumaplddqlkjuqmzhfiv.supabase.co; connect-src 'self' https://cumaplddqlkjuqmzhfiv.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
